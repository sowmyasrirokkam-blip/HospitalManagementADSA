<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancel Appointment - Hospital Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            color: #333;
        }

        header {
            background: #0b6e8e;
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-box h2 {
            text-align: center;
            color: #0b6e8e;
            margin-bottom: 15px;
        }

        .form-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0b6e8e;
        }

        .cancel-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #d9534f;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #c9302c;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #555;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <header>
        <h1>Cancel Appointment</h1>
        <p>Cancel an existing patient appointment</p>
    </header>

    <div class="container">

        <div class="form-box">

            <h2>Cancel Appointment</h2>

            <p>
                Enter the Appointment ID you want to cancel.
            </p>

            <form>

                <div class="form-group">
                    <label for="appointmentId">
                        Appointment ID
                    </label>

                    <input type="number"
                           id="appointmentId"
                           name="appointmentId"
                           placeholder="Enter appointment ID"
                           required>
                </div>

                <button type="submit" class="cancel-btn">
                    ❌ Cancel Appointment
                </button>

            </form>

        </div>

        <a href="appointments.html" class="back-btn">
            ← Back to Appointment Management
        </a>

    </div>

</body>
</html>
