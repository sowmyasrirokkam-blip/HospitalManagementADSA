<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Emergency Patient - Hospital Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            color: #333;
        }

        header {
            background: #b42318;
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-box h2 {
            text-align: center;
            color: #b42318;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #b42318;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #b42318;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #8f1c14;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #555;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <header>
        <h1>Add Emergency Patient</h1>
        <p>Register a patient requiring immediate emergency care</p>
    </header>

    <div class="container">

        <div class="form-box">

            <h2>Emergency Patient Details</h2>

            <form>

                <div class="form-group">
                    <label for="patientId">Patient ID</label>
                    <input type="number"
                           id="patientId"
                           name="patientId"
                           placeholder="Enter patient ID"
                           required>
                </div>

                <div class="form-group">
                    <label for="name">Patient Name</label>
                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Enter patient name"
                           required>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number"
                           id="age"
                           name="age"
                           placeholder="Enter age"
                           min="0"
                           required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="priority">Emergency Priority</label>
                    <select id="priority" name="priority" required>
                        <option value="">Select Priority</option>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="condition">Emergency Condition</label>
                    <textarea id="condition"
                              name="condition"
                              placeholder="Enter emergency condition"
                              required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    🚑 Add Emergency Patient
                </button>

            </form>

        </div>

        <a href="emergency.html" class="back-btn">
            ← Back to Emergency Care
        </a>

    </div>

</body>
</html>
