<!DOCTYPE html>
<html>
<head>
    <title>Emergency Priority</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: #b42318;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #b42318;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #b42318;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #8f1c14;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>Hospital Management System</h1>
    <p>Emergency Priority Management</p>
</header>

<div class="container">

    <h2>Set Emergency Priority</h2>

    <form>

        <label for="patientId">Patient ID</label>
        <input type="number"
               id="patientId"
               name="patientId"
               placeholder="Enter Patient ID"
               required>

        <label for="priority">Emergency Priority</label>
        <select id="priority" name="priority" required>
            <option value="">Select Priority</option>
            <option value="Critical">Critical</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>

        <button type="submit">Set Priority</button>

    </form>

    <a href="emergency.html" class="back">
        ← Back to Emergency Management
    </a>

</div>

</body>
</html>
