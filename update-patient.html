<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Patient - Hospital Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fb;
            color: #263238;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        header {
            background: #0b6e8e;
            color: white;

            padding: 18px 60px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* MAIN */

        .main-section {
            flex: 1;

            display: flex;
            justify-content: center;

            padding: 45px 20px;
        }

        /* CARD */

        .form-card {
            background: white;

            width: 100%;
            max-width: 600px;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.10);
        }

        .icon {
            text-align: center;

            font-size: 48px;

            margin-bottom: 10px;
        }

        h1 {
            text-align: center;

            color: #0b6e8e;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .description {
            text-align: center;

            color: #607d8b;

            margin-bottom: 30px;

            font-size: 14px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #37474f;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #cfd8dc;

            border-radius: 6px;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0b6e8e;

            box-shadow:
                0 0 0 2px rgba(11, 110, 142, 0.10);
        }

        textarea {
            min-height: 90px;

            resize: vertical;
        }

        /* BUTTONS */

        .button-container {
            display: flex;

            gap: 15px;

            margin-top: 30px;
        }

        .btn {
            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            text-align: center;

            text-decoration: none;

            cursor: pointer;
        }

        .update-btn {
            background: #0b6e8e;

            color: white;
        }

        .update-btn:hover {
            background: #07556d;
        }

        .back-btn {
            background: #eceff1;

            color: #37474f;
        }

        .back-btn:hover {
            background: #cfd8dc;
        }

        /* FOOTER */

        footer {
            background: #263238;

            color: white;

            text-align: center;

            padding: 20px;

            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 18px 25px;

                flex-direction: column;

                gap: 15px;
            }

            .form-card {
                padding: 30px 25px;
            }

            .button-container {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="logo">
            🏥 Hospital Management
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="patients.html">
                Patients
            </a>

            <a href="login.html">
                Logout
            </a>

        </nav>

    </header>


    <!-- MAIN -->

    <main class="main-section">

        <div class="form-card">

            <div class="icon">
                ✏️
            </div>

            <h1>
                Update Patient
            </h1>

            <p class="description">
                Update the patient's information below
            </p>


            <!-- FORM -->

            <form action="UpdatePatientServlet"
                  method="post">


                <!-- PATIENT ID -->

                <div class="form-group">

                    <label for="patientId">
                        Patient ID
                    </label>

                    <input
                        type="number"
                        id="patientId"
                        name="patientId"
                        placeholder="Enter Patient ID"
                        required
                    >

                </div>


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Patient Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter patient name"
                        required
                    >

                </div>


                <!-- AGE -->

                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Enter age"
                        required
                    >

                </div>


                <!-- GENDER -->

                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select
                        id="gender"
                        name="gender"
                        required>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter address"
                        required></textarea>

                </div>


                <!-- DISEASE -->

                <div class="form-group">

                    <label for="disease">
                        Disease
                    </label>

                    <input
                        type="text"
                        id="disease"
                        name="disease"
                        placeholder="Enter disease"
                    >

                </div>


                <!-- BUTTONS -->

                <div class="button-container">

                    <button
                        type="submit"
                        class="btn update-btn">

                        ✏️ Update Patient

                    </button>


                    <a
                        href="patients.html"
                        class="btn back-btn">

                        ← Back

                    </a>

                </div>


            </form>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 Hospital Management System

    </footer>


</body>

</html>
