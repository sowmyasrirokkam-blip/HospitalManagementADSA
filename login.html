<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Hospital Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fb;
            color: #263238;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        header {
            background: #0b6e8e;
            color: white;

            padding: 18px 60px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* LOGIN AREA */

        .login-section {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 20px;
        }

        /* LOGIN CARD */

        .login-card {
            background: white;

            width: 100%;
            max-width: 420px;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.10);
        }

        .login-icon {
            text-align: center;

            font-size: 50px;

            margin-bottom: 15px;
        }

        .login-card h1 {
            text-align: center;

            color: #0b6e8e;

            font-size: 30px;

            margin-bottom: 10px;
        }

        .login-description {
            text-align: center;

            color: #607d8b;

            margin-bottom: 30px;

            font-size: 14px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #37474f;
        }

        .form-group input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #cfd8dc;

            border-radius: 6px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #0b6e8e;

            box-shadow:
                0 0 0 2px rgba(11, 110, 142, 0.10);
        }

        /* LOGIN BUTTON */

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background: #0b6e8e;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .login-button:hover {
            background: #07556d;
        }

        /* BACK LINK */

        .back-home {
            text-align: center;

            margin-top: 25px;
        }

        .back-home a {
            color: #0b6e8e;

            text-decoration: none;

            font-size: 14px;
        }

        .back-home a:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        footer {
            background: #263238;

            color: white;

            text-align: center;

            padding: 20px;

            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 18px 25px;

                flex-direction: column;

                gap: 15px;
            }

            .login-card {
                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            🏥 Hospital Management
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="login.html">Login</a>

        </nav>

    </header>


    <!-- LOGIN SECTION -->

    <main class="login-section">

        <div class="login-card">

            <div class="login-icon">
                🔐
            </div>

            <h1>
                Login
            </h1>

            <p class="login-description">
                Login to access the Hospital Management System
            </p>


            <form>

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>

            </form>


            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 Hospital Management System

    </footer>


</body>

</html>
