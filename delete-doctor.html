<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Doctor</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fb;
            color: #263238;
        }

        /* HEADER */

        header {
            background: #0b6e8e;
            color: white;

            padding: 18px 60px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* PAGE */

        .page {
            min-height: 70vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 20px;
        }

        .delete-card {
            width: 500px;

            background: white;

            padding: 45px;

            border-radius: 14px;

            text-align: center;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #c62828;

            font-size: 34px;

            margin-bottom: 15px;
        }

        .description {
            color: #607d8b;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        /* FORM */

        .form-group {
            text-align: left;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #b0bec5;

            border-radius: 6px;

            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #0b6e8e;
        }

        /* BUTTONS */

        .buttons {
            display: flex;

            justify-content: center;

            gap: 15px;
        }

        button,
        .back-btn {
            padding: 12px 25px;

            border: none;

            border-radius: 6px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;
        }

        button {
            background: #c62828;
            color: white;
        }

        button:hover {
            background: #a51f1f;
        }

        .back-btn {
            background: #607d8b;
            color: white;
        }

        .back-btn:hover {
            background: #455a64;
        }

        /* FOOTER */

        footer {
            background: #263238;

            color: white;

            text-align: center;

            padding: 22px;

            font-size: 14px;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            🏥 Hospital Management
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="doctors.html">
                Doctor Management
            </a>

        </nav>

    </header>


    <!-- DELETE DOCTOR -->

    <section class="page">

        <div class="delete-card">

            <div class="icon">
                🗑️
            </div>

            <h1>
                Delete Doctor
            </h1>

            <p class="description">
                Enter the Doctor ID of the doctor
                you want to remove from the system.
            </p>


            <form>

                <div class="form-group">

                    <label for="doctorId">
                        Doctor ID
                    </label>

                    <input
                        type="number"
                        id="doctorId"
                        name="doctorId"
                        placeholder="Enter Doctor ID"
                        required>

                </div>


                <div class="buttons">

                    <button type="submit">
                        Delete Doctor
                    </button>

                    <a
                        href="doctors.html"
                        class="back-btn">

                        ← Back

                    </a>

                </div>

            </form>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        © 2026 Hospital Management System

    </footer>

</body>

</html>
