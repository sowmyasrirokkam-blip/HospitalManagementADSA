<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Patient - Hospital Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fb;
            color: #263238;
            min-height: 100vh;
        }

        /* HEADER */

        header {
            background: #0b6e8e;
            color: white;

            padding: 18px 60px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* MAIN */

        .page-container {
            width: 90%;
            max-width: 800px;

            margin: 50px auto;
        }

        .page-title {
            text-align: center;

            margin-bottom: 30px;
        }

        .page-title h1 {
            color: #0b6e8e;

            font-size: 36px;

            margin-bottom: 10px;
        }

        .page-title p {
            color: #607d8b;

            font-size: 15px;
        }

        /* FORM CARD */

        .form-card {
            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        /* FORM */

        .form-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #37474f;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #cfd8dc;

            border-radius: 6px;

            font-size: 15px;

            font-family: Arial, Helvetica, sans-serif;

            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0b6e8e;

            box-shadow:
                0 0 0 2px rgba(11, 110, 142, 0.10);
        }

        textarea {
            min-height: 100px;

            resize: vertical;
        }

        /* BUTTONS */

        .button-container {
            display: flex;

            gap: 15px;

            margin-top: 10px;
        }

        .btn {
            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            text-align: center;

            text-decoration: none;

            cursor: pointer;
        }

        .add-btn {
            background: #0b6e8e;

            color: white;
        }

        .add-btn:hover {
            background: #07556d;
        }

        .back-btn {
            background: #eceff1;

            color: #37474f;
        }

        .back-btn:hover {
            background: #cfd8dc;
        }

        /* FOOTER */

        footer {
            background: #263238;

            color: white;

            text-align: center;

            padding: 20px;

            margin-top: 50px;

            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            header {
                padding: 18px 25px;

                flex-direction: column;

                gap: 15px;
            }

            .page-container {
                width: 92%;

                margin: 35px auto;
            }

            .form-card {
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .button-container {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="logo">
            🏥 Hospital Management
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="patients.html">
                Patients
            </a>

            <a href="login.html">
                Logout
            </a>

        </nav>

    </header>


    <!-- MAIN CONTENT -->

    <main class="page-container">


        <div class="page-title">

            <h1>
                Add Patient
            </h1>

            <p>
                Register a new patient in the hospital system
            </p>

        </div>


        <!-- FORM CARD -->

        <div class="form-card">


            <!-- IMPORTANT:
                 Keep this action for your Servlet.
                 @WebServlet("/AddPatientServlet")
            -->

            <form action="AddPatientServlet"
                  method="post">


                <!-- PATIENT ID + NAME -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="patientId">
                            Patient ID
                        </label>

                        <input
                            type="number"
                            id="patientId"
                            name="patientId"
                            placeholder="Enter patient ID"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="name">
                            Patient Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter patient name"
                            required
                        >

                    </div>

                </div>


                <!-- AGE + GENDER -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            placeholder="Enter age"
                            min="1"
                            max="120"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="gender">
                            Gender
                        </label>

                        <select
                            id="gender"
                            name="gender"
                            required>

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter patient address"
                        required></textarea>

                </div>


                <!-- DISEASE -->

                <div class="form-group">

                    <label for="disease">
                        Disease / Medical Condition
                    </label>

                    <input
                        type="text"
                        id="disease"
                        name="disease"
                        placeholder="Enter disease or medical condition"
                        required
                    >

                </div>


                <!-- BUTTONS -->

                <div class="button-container">

                    <button
                        type="submit"
                        class="btn add-btn">

                        ➕ Add Patient

                    </button>


                    <a
                        href="patients.html"
                        class="btn back-btn">

                        ← Back

                    </a>

                </div>


            </form>


        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 Hospital Management System

    </footer>


</body>

</html>
